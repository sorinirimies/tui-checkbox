[package]
name = "tui-checkbox"
version = "0.5.3"
authors = ["Sorin Albu-Irimies <sorinirimies@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A customizable checkbox widget for Ratatui TUI applications"
repository = "https://github.com/sorinirimies/tui-checkbox"
documentation = "https://docs.rs/tui-checkbox"
homepage = "https://github.com/sorinirimies/tui-checkbox"
keywords = ["tui", "terminal", "ratatui", "checkbox", "widget"]
categories = ["command-line-interface"]
readme = "README.md"
exclude = [".cargo/", "fuzz/", ".github/", ".gitea/"]

[dependencies]
ratatui = { version = "0.30", default-features = false }
tui-nuances = { version = "0.1.11", optional = true }

[features]
default = ["theme"]
# Shared theming via tui-nuances (`Checkbox::theme`, `Themed`, ...)
theme = ["dep:tui-nuances"]

[dev-dependencies]
color-eyre = "0.6"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

[lib]
name = "tui_checkbox"
path = "src/lib.rs"

[[example]]
name = "checkbox"
path = "examples/checkbox.rs"

[[test]]
name = "theme_test"
path = "tests/theme_test.rs"
required-features = ["theme"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
