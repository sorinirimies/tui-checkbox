[package]
name = "tui-checkbox"
version = "0.5.0"
authors = ["Sorin Albu-Irimies <sorinirimies@gmail.com>"]
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
description = "A customizable checkbox widget for Ratatui TUI applications"
repository = "https://github.com/sorinirimies/tui-checkbox"
homepage = "https://github.com/sorinirimies/tui-checkbox"
keywords = ["tui", "terminal", "ratatui", "checkbox", "widget"]
categories = ["command-line-interface"]
readme = "README.md"

[dependencies]
ratatui = { version = "0.30", default-features = false }
# TODO: switch to the crates.io version after tui-nuances is published
tui-nuances = { git = "https://github.com/sorinirimies/tui-nuances" }

[dev-dependencies]
color-eyre = "0.6"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

[lib]
name = "tui_checkbox"
path = "src/lib.rs"

[[example]]
name = "checkbox"
path = "examples/checkbox.rs"
