name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:00 UTC every day (03:00 CET)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: deps-update
  cancel-in-progress: true

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      # ── cargo-edit (provides `cargo upgrade`) ────────────────────────────────
      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      # ── Pre-warm cargo registry ─────────────────────────────────────────────
      # `cargo upgrade`'s recursive-dep resolver runs in offline mode and only
      # considers package sources that are physically present in the local cache.
      # If a previously-cached version has since been yanked the offline resolver
      # finds no valid candidate and aborts.  Running `cargo update` first
      # refreshes the registry index and rewrites Cargo.lock to non-yanked
      # versions; `cargo fetch` then downloads those sources so the offline
      # phase has at least one valid, non-yanked candidate for every transitive
      # dependency.
      - name: Pre-warm cargo registry (refresh index + fetch sources)
        run: cargo update && cargo fetch

      # ── Upgrade all dependency pins ──────────────────────────────────────────
      # `cargo upgrade` (compatible-only) rewrites version constraints in
      # Cargo.toml within their semver range. Major bumps stay a manual step.
      # `cargo update` then resolves the new constraints into Cargo.lock.
      # A snapshot of the declared requirements is taken first so we can tell
      # a REAL requirement change apart from cargo-edit reformatting.
      - name: Upgrade dependency pins
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind)' > "$RUNNER_TEMP/deps_before.json"
          cargo upgrade

      - name: Sync Cargo.lock
        run: cargo update

      # ── Check for changes ────────────────────────────────────────────────────
      # `release` is true ONLY when dependency requirements declared in
      # Cargo.toml really changed (consumers resolve from those, never from our
      # Cargo.lock). Lock-only refreshes are committed but never released.
      # cargo-edit may reserialize Cargo.toml cosmetically; that is discarded.
      - name: Check for changes
        id: check
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind)' > "$RUNNER_TEMP/deps_after.json"
          if cmp -s "$RUNNER_TEMP/deps_before.json" "$RUNNER_TEMP/deps_after.json"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            git checkout -- Cargo.toml
            REQ=0
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "📦 Dependency requirements changed → patch release."
            REQ=1
          fi
          if [ "$REQ" = 0 ] && git diff --quiet Cargo.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Quality gate ───────────────────────────────────────────────────────
      - name: Check formatting
        if: steps.check.outputs.has_changes == 'true'
        run: cargo fmt -- --check

      - name: Run clippy
        if: steps.check.outputs.has_changes == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings -A deprecated

      - name: Run tests
        if: steps.check.outputs.has_changes == 'true'
        run: cargo test --all-features --all-targets

      - name: Run Nushell script tests
        if: steps.check.outputs.has_changes == 'true'
        run: nu scripts/tests/run_all.nu

      # ── Commit and push directly to main ───────────────────────────────────
      # The quality gate already passed — safe to push directly.
      - name: Commit and push dependency updates
        if: steps.check.outputs.has_changes == 'true'
        run: |
          DATE=$(date -u '+%Y-%m-%d')

          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"

          if [ "${{ steps.check.outputs.release }}" = "true" ]; then
            MSG="chore(deps): nightly dependency upgrade $DATE"
          else
            MSG="chore(deps): update Cargo.lock"
          fi

          git add Cargo.toml Cargo.lock
          git commit -m "$MSG"
          git push origin main

          echo "✅ Dependency updates pushed to main."

      # ── Bump patch version and tag ──────────────────────────────────────────
      # Only runs when dependency requirements changed (patch release).
      # A fresh tag push triggers release.yml (on: push: tags: v*), which
      # publishes crates.io + release with the newly bumped deps.
      - name: Bump patch version and push release tag
        if: steps.check.outputs.release == 'true'
        run: |
          CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          NEW_VERSION=$(nu scripts/next_patch_version.nu "$CURRENT_VERSION" --safe)
          NEW_TAG="v$NEW_VERSION"
          echo "Bumping version: $CURRENT_VERSION -> $NEW_VERSION"

          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          cargo update -p tui-checkbox

          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin main
          git push origin "$NEW_TAG"

          echo "✅ Tagged and pushed $NEW_TAG — release workflow will pick it up."

          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"

      - name: Push release commit and tag to GitHub mirror
        if: steps.check.outputs.has_changes == 'true' && env.GITHUB_REMOTE_URL != ''
        env:
          GITHUB_REMOTE_URL: ${{ secrets.GITHUB_REMOTE_URL }}
        run: |
          git remote add github-ci "$GITHUB_REMOTE_URL"
          git push github-ci main
          if [ -n "$NEW_TAG" ]; then git push github-ci "$NEW_TAG"; fi

      # Pushes authored by the built-in actions token do NOT reliably trigger
      # other tag-push-triggered workflows on some Gitea versions (same
      # anti-recursion behavior as GitHub) — dispatch release.yml explicitly
      # via the Actions API as a belt-and-braces guarantee it always fires
      # (independent of whether a GitHub mirror is configured above).
      - name: Trigger release workflow for the new tag
        if: steps.check.outputs.release == 'true'
        run: |
          NEW_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="v$NEW_VERSION"
          echo "🚀 Dispatching release.yml for ${TAG}…"
          curl -sf -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"main\", \"inputs\": {\"tag\": \"${TAG}\"}}"

      - name: Nothing to update
        if: steps.check.outputs.has_changes == 'false'
        run: echo "✅ All dependencies already up to date — nothing to upgrade."
